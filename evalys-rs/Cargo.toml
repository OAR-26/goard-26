[package]
name = "evalys-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "evalys-rs"
path = "src/main.rs"

[dependencies]
goard_core = { path = "../goard_core" }
eframe = "0.30.0"
chrono = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
rfd = "0.15"
native-dialog = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.70", features = ["Performance", "Document", "Window", "Element", "HtmlInputElement", "File", "FileList", "Blob", "FileReader"] }
js-sys = "0.3"
log = "0.4"
console_error_panic_hook = "0.1.7"
