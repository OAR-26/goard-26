[package]
name = "liveOAR"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "liveOAR"
path = "src/main.rs"

[dependencies]
ganttza = { path = "../ganttza" }
eframe = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
getrandom = { version = "0.2", features = ["js", "wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3.70", features = ["Performance", "Document", "Window", "Element", "HtmlInputElement", "File", "FileList", "Blob", "FileReader", "Storage"] }
js-sys = "0.3"
log = "0.4"
console_error_panic_hook = "0.1.7"
