[package]
name = "goard_core"
version = "1.1.0"
edition = "2021"
authors = ["Romain MIRAS <romain.miras@gmail.com>", "Alexandre ARLE <arle.alexandre@protonmail.com>", "Amaury GOGUILLOT <goguillot.amaury@gmail.com>", "Rémi DEL MEDICO <redelmedico@gmail.com>", "Aymane AMESSEGHER <amessegheraymane@gmail.com>"]

[lib]
name = "goard_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
egui = "0.30.0"
eframe = "0.30.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
toml = "0.8"
egui_extras = "0.30.0"
rust-i18n = "3.1.2"
getrandom = { version = "0.2", features = ["js", "wasm-bindgen"] }
rand = "0.8"

strum = "0.24"
strum_macros = "0.24"
egui_plot = "0.30.0"
chrono-tz = "0.10.1"
range-set-blaze = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[features]
serde = []
